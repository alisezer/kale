# ~/.tmux.conf — kale. Colours are ANSI names, so they follow the Ghostty theme (GrokNight/GrokDay).

# ── Terminal ────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -s escape-time 10
set -g focus-events on
set -g set-clipboard on                     # OSC 52: copy reaches the Mac clipboard
set -s extended-keys on                     # shift+enter for Claude Code / Codex
set -as terminal-features "xterm*:extkeys"
set -g set-titles on
# Terminal tab title: session name for kale project sessions (option @project), else host: window
set -g set-titles-string "#{?@project,#S,#h: #W}"

# ── Behaviour ───────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000
set -g repeat-time 600
setw -g automatic-rename on
# window name = current folder
setw -g automatic-rename-format "#{b:pane_current_path}"
# Tab label: Claude Code and Antigravity (agy) panes show busy/idle glyph + session name
# (@cc_name, set by ~/.local/bin/tmux-claude-title from status-right every status-interval). A tab renamed by hand (prefix ,) keeps that name.
set -g @tab "#{?#{automatic-rename},#{?#{==:#{pane_current_command},claude},#{=1:pane_title} #{?@cc_name,#{@cc_name},Claude Code},#{?#{==:#{pane_current_command},agy},#{?@cc_name,#{@cc_name},◇ Antigravity},#W}},#W}"
setw -g aggressive-resize on

# ── Prefix: C-a (C-b still works). C-a C-a sends a literal C-a. ─────────────
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix
bind r source-file ~/.tmux.conf \; display "config reloaded"

# ── Windows & panes (open in the current folder) ────────────────────────────
bind c   new-window      -c "#{pane_current_path}"
bind |   split-window -h -c "#{pane_current_path}"
bind \\  split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind x   kill-pane                          # no confirm prompt
bind ,   command-prompt -I "#W" { rename-window "%%" }

# prefix + h/j/k/l move between panes; H/J/K/L resize (repeatable)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind Tab last-window
bind s choose-tree -Zs                      # session/window picker, zoomed

# No prefix: Option+arrows = panes, Option+1..9 = windows, Option+[ / ] = prev/next window
# (needs Ghostty `macos-option-as-alt = true` on the Mac)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-[ previous-window
bind -n M-] next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ── Copy mode: vi keys. prefix + [ to enter, v select, y copy, q quit ───────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# ── Look ────────────────────────────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=brightblack"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=black,bg=green,bold] 󰒋 #h #[fg=green,bg=default,bold] #S #[default] "
set -g status-right "#(~/.local/bin/tmux-claude-title)#{?client_prefix,#[fg=black#,bg=yellow#,bold] PREFIX #[default] ,}#{?window_zoomed_flag,#[fg=yellow]󰊓 zoom  ,}#[fg=white]%a %H:%M "

setw -g window-status-separator ""
setw -g window-status-format " #[fg=brightblack]#I #[fg=white]#{E:@tab}#{?window_bell_flag, #[fg=red]●,} "
setw -g window-status-current-format "#[fg=magenta,bold] #I #[fg=brightwhite]#{E:@tab}#{?window_zoomed_flag,#[fg=yellow] ◆,} "
setw -g window-status-activity-style "fg=yellow"
setw -g monitor-activity off

set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=magenta"
set -g pane-border-lines heavy
set -g pane-border-status off
set -g display-panes-active-colour magenta
set -g display-panes-colour brightblack

set -g message-style "fg=black,bg=magenta,bold"
set -g message-command-style "fg=magenta,bg=default"
setw -g mode-style "fg=black,bg=magenta"
setw -g clock-mode-colour magenta

# ── Tabs (windows), no prefix: Shift+←/→ switch, Shift+↓ new tab in the current folder ──
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n S-Down  new-window -c "#{pane_current_path}"

# kale session manager (~/.local/bin/kale): Alt+q detaches back to the picker
bind -n M-q detach-client
