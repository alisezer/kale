[package]
name = "kale"
version = "0.1.0"
edition = "2021"
description = "Session manager for kale: projects + tmux sessions, one per terminal tab"

[dependencies]
anyhow = "1"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
strip = true
