[package]
name = "kale"
version = "0.1.0"
edition = "2021"
description = "tmux session picker for a headless server driven over SSH: projects, one session per terminal tab, Claude Code aware"
license = "MIT"
repository = "https://github.com/alisezer/kale"
readme = "README.md"
keywords = ["tmux", "session-manager", "ssh", "claude-code", "tui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
strip = true
